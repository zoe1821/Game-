# Catálogo semilla — productos reales, transcritos de fotos de etiqueta.
#
# Solo datos fácticos del envase: marca, nombre, categoría, INCI y en qué
# países se distribuye. Los atributos (fijación, proteína, tensioactivo...) NO
# se escriben aquí: se derivan del INCI en `Product.from_inci`, para que sean
# reproducibles y auditables en vez de opinión de quien cargó la ficha.
#
# Recordatorio de docs/02-MONETIZATION.md §4: aquí no hay, ni puede haber,
# ningún campo comercial.

version: 1
source_note: >
  Transcrito de fotografías de envase aportadas para el desarrollo. Los
  fabricantes reformulan sin cambiar el nombre del producto, así que cada
  ficha lleva la fecha de lectura y el INCI debe reverificarse antes de
  cualquier uso en producción.
read_on: 2026-08-27

